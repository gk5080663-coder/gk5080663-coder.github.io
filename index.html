            return { id: i + 1, engine: engine, color: colors[i % colors.length], category: engine };

        function populateFormInputs() {
            document.getElementById('inp-fullname').value = resumeData.fullname;
            document.getElementById('inp-jobtitle').value = resumeData.jobtitle;
            document.getElementById('inp-email').value = resumeData.email;
            document.getElementById('inp-phone').value = resumeData.phone;
            document.getElementById('inp-location').value = resumeData.location;
            document.getElementById('inp-linkedin').value = resumeData.linkedin;
            document.getElementById('inp-summary').value = resumeData.summary;
            document.getElementById('inp-skills').value = resumeData.skills.join(', ');
        }

        function renderTemplateGallery(filterCategory) {
            const container = document.getElementById('template-gallery-container');
            container.innerHTML = '';
            templatePresets.forEach(tpl => {
                if (filterCategory !== 'all' && tpl.category !== filterCategory) return;
                const card = document.createElement('button');
                card.onclick = () => selectTemplate(tpl.id);
                card.className = `p-1.5 text-center rounded border flex flex-col items-center gap-1 ${currentTemplateId === tpl.id ? 'border-green-600 bg-green-50 ring-2 ring-green-500' : 'bg-white border-slate-200'}`;
                card.innerHTML = `<div class="w-full h-8 rounded text-[9px] font-bold text-white flex items-center justify-center" style="background-color: ${tpl.color}">T-${tpl.id}</div><span class="text-[9px] text-slate-700 font-medium">T-${tpl.id}</span>`;
                container.appendChild(card);
            });
            document.getElementById('active-template-badge').innerText = `${currentTemplateId} / 101 Selected`;
        }

        function filterTemplates(cat) { renderTemplateGallery(cat); }

        function selectTemplate(id) {
            currentTemplateId = id;
            renderTemplateGallery('all');
            updateResume();
        }

        function changeLanguage(lang) {
            currentLang = lang;
            ['en', 'mr', 'hi', 'kn'].forEach(l => {
                document.getElementById(`lang-${l}`).className = l === lang ? "px-2.5 py-1 text-xs rounded font-semibold bg-green-600 text-white" : "px-2.5 py-1 text-xs rounded font-semibold text-slate-300 hover:bg-slate-700";
            });
            updateLanguageUI();
            loadSelectedSample();
            updateResume();
        }

        function loadSelectedSample() {
            const selectedKey = document.getElementById('sample-profile-select').value;
            const samplesObj = i18n[currentLang] && i18n[currentLang].samples ? i18n[currentLang].samples : i18n['en'].samples;
            const sampleData = samplesObj[selectedKey];

            if (sampleData) {
                document.getElementById('inp-fullname').value = sampleData.fullname || '';
                document.getElementById('inp-jobtitle').value = sampleData.jobtitle || '';
                document.getElementById('inp-location').value = sampleData.location || '';
                document.getElementById('inp-summary').value = sampleData.summary || '';

        function switchFormTab(tab) {
            ['personal', 'experience', 'education', 'skills', 'more'].forEach(t => {
                document.getElementById(`form-tab-${t}`).classList.add('hidden');

            });
            document.getElementById(`form-tab-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).className = "px-3 py-3 font-semibold border-b-2 border-green-600 text-green-600 whitespace-nowrap";
        }

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    resumeData.photo = e.target.result;
                    document.getElementById('photo-preview').src = resumeData.photo;
                    document.getElementById('photo-preview').classList.remove('hidden');
                    document.getElementById('photo-placeholder').classList.add('hidden');
                    updateResume();
                };
                reader.readAsDataURL(file);
            }
        }

        function removePhoto() {
            resumeData.photo = '';
            document.getElementById('photo-preview').src = '';
            document.getElementById('photo-preview').classList.add('hidden');
            document.getElementById('photo-placeholder').classList.remove('hidden');
            updateResume();
        }

            resumeData.skills = document.getElementById('inp-skills').value.split(',').map(s => s.trim()).filter(Boolean);

            const tpl = templatePresets.find(p => p.id === currentTemplateId) || templatePresets[0];
            const target = document.getElementById('resume-render-target');
            const t = i18n[currentLang];

            let photoHtml = resumeData.photo ? `<img src="${resumeData.photo}" class="w-20 h-20 rounded-full object-cover border-2 border-white shadow">` : '';
            let skillsHtml = resumeData.skills.map(s => `<span class="bg-slate-100 text-slate-800 text-xs px-2.5 py-1 rounded-md font-medium">${s}</span>`).join('');
            
            let expHtml = resumeData.experiences.map(e => `<div class="mb-3"><div class="flex justify-between font-bold text-sm"><span>${e.role}</span><span class="text-xs text-slate-500">${e.duration}</span></div><div class="text-xs text-green-700 font-medium">${e.company}</div><p class="text-xs text-slate-600 mt-0.5">${e.details}</p></div>`).join('');
            let eduHtml = resumeData.education.map(ed => `<div class="mb-2"><div class="flex justify-between font-bold text-sm"><span>${ed.degree}</span><span class="text-xs text-slate-500">${ed.year}</span></div><div class="text-xs text-slate-600">${ed.school}</div></div>`).join('');
            let projHtml = resumeData.projects.map(p => `<div class="mb-2"><div class="font-bold text-sm">${p.title}</div><p class="text-xs text-slate-600">${p.desc}</p></div>`).join('');

            if (tpl.engine === 'sidebar') {
                target.innerHTML = `
                    <div class="flex h-full min-h-[297mm] bg-white text-slate-800">
                        <div class="w-1/3 p-6 text-white flex flex-col gap-6" style="background-color: ${tpl.color}">
                            <div class="flex flex-col items-center text-center gap-3">
                                ${photoHtml}
                                <h2 class="text-lg font-bold">${resumeData.fullname}</h2>
                                <p class="text-xs opacity-90">${resumeData.jobtitle}</p>
                            </div>
                            <div class="space-y-2 text-xs">
                                <p><i class="fa-solid fa-envelope mr-1.5"></i> ${resumeData.email}</p>
                                <p><i class="fa-solid fa-phone mr-1.5"></i> ${resumeData.phone}</p>
                                <p><i class="fa-solid fa-location-dot mr-1.5"></i> ${resumeData.location}</p>
                                ${resumeData.linkedin ? `<p><i class="fa-brands fa-linkedin mr-1.5"></i> ${resumeData.linkedin}</p>` : ''}
                            </div>
                            <div>
                                <h3 class="font-bold text-xs uppercase tracking-wider mb-2 border-b border-white/20 pb-1">${t.secSkills}</h3>
                                <div class="flex flex-wrap gap-1">${resumeData.skills.map(s => `<span class="bg-white/10 text-white text-[11px] px-2 py-0.5 rounded">${s}</span>`).join('')}</div>
                            </div>
                        </div>
                        <div class="w-2/3 p-8 flex flex-col gap-6">
                            <div>
                                <h3 class="font-bold text-sm uppercase tracking-wider mb-2 border-b pb-1" style="color: ${tpl.color}">${t.secSummary}</h3>
                                <p class="text-xs text-slate-600 leading-relaxed">${resumeData.summary}</p>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm uppercase tracking-wider mb-3 border-b pb-1" style="color: ${tpl.color}">${t.secExp}</h3>
                                ${expHtml}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm uppercase tracking-wider mb-3 border-b pb-1" style="color: ${tpl.color}">${t.secEdu}</h3>
                                ${eduHtml}
                            </div>
                            <div>
                                <h3 class="font-bold text-sm uppercase tracking-wider mb-3 border-b pb-1" style="color: ${tpl.color}">${t.secProj}</h3>
                                ${projHtml}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                target.innerHTML = `
                    <div class="p-8 flex flex-col gap-6 bg-white text-slate-800 min-h-[297mm]">
                        <div class="flex items-center gap-4 border-b pb-6" style="border-color: ${tpl.color}">
                            ${photoHtml}
                            <div>
                                <h2 class="text-2xl font-extrabold" style="color: ${tpl.color}">${resumeData.fullname}</h2>
                                <p class="text-sm font-medium text-slate-600">${resumeData.jobtitle}</p>
                                <div class="flex flex-wrap gap-3 text-xs text-slate-500 mt-2">
                                    <span><i class="fa-solid fa-envelope mr-1"></i> ${resumeData.email}</span>
                                    <span><i class="fa-solid fa-phone mr-1"></i> ${resumeData.phone}</span>
                                    <span><i class="fa-solid fa-location-dot mr-1"></i> ${resumeData.location}</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs uppercase tracking-wider mb-1 text-slate-400">${t.secSummary}</h3>
                            <p class="text-xs text-slate-700 leading-relaxed">${resumeData.summary}</p>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs uppercase tracking-wider mb-2 text-slate-400">${t.secSkills}</h3>
                            <div class="flex flex-wrap gap-1.5">${skillsHtml}</div>
                        </div>
                        <div>
                            <h3 class="font-bold text-xs uppercase tracking-wider mb-3 text-slate-400">${t.secExp}</h3>
                            ${expHtml}
                        </div>
                        <div>
                            <h3 class="font-bold text-xs uppercase tracking-wider mb-3 text-slate-400">${t.secEdu}</h3>
                            ${eduHtml}
                        </div>
                        <div>
                            <h3 class="font-bold text-xs uppercase tracking-wider mb-3 text-slate-400">${t.secProj}</h3>
                            ${projHtml}
                        </div>
                    </div>
                `;
            }
        }

        function renderExperiences() {
            const container = document.getElementById('experience-list');
            container.innerHTML = resumeData.experiences.map((e, i) => `
                <div class="p-3 bg-slate-50 rounded border space-y-2 relative text-xs">
                    <button onclick="removeExperience(${i})" class="absolute top-2 right-2 text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    <input type="text" value="${e.role}" oninput="resumeData.experiences[${i}].role=this.value; updateResume();" placeholder="Role" class="w-full p-1.5 border rounded">
                    <input type="text" value="${e.company}" oninput="resumeData.experiences[${i}].company=this.value; updateResume();" placeholder="Company" class="w-full p-1.5 border rounded">
                    <input type="text" value="${e.duration}" oninput="resumeData.experiences[${i}].duration=this.value; updateResume();" placeholder="Duration" class="w-full p-1.5 border rounded">
                    <textarea rows="2" oninput="resumeData.experiences[${i}].details=this.value; updateResume();" placeholder="Details" class="w-full p-1.5 border rounded">${e.details}</textarea>
                </div>
            `).join('');
        }

        function addExperience() {
            resumeData.experiences.push({ role: '', company: '', duration: '', details: '' });
            renderExperiences();
            updateResume();
        }

        function removeExperience(i) {
            resumeData.experiences.splice(i, 1);
            renderExperiences();
            updateResume();
        }

        function renderEducation() {
            const container = document.getElementById('education-list');
            container.innerHTML = resumeData.education.map((ed, i) => `
                <div class="p-3 bg-slate-50 rounded border space-y-2 relative text-xs">
                    <button onclick="removeEducation(${i})" class="absolute top-2 right-2 text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    <input type="text" value="${ed.degree}" oninput="resumeData.education[${i}].degree=this.value; updateResume();" placeholder="Degree" class="w-full p-1.5 border rounded">
                    <input type="text" value="${ed.school}" oninput="resumeData.education[${i}].school=this.value; updateResume();" placeholder="School/University" class="w-full p-1.5 border rounded">
                    <input type="text" value="${ed.year}" oninput="resumeData.education[${i}].year=this.value; updateResume();" placeholder="Year" class="w-full p-1.5 border rounded">
                </div>
            `).join('');
        }

        function addEducation() {
            resumeData.education.push({ degree: '', school: '', year: '' });
            renderEducation();
            updateResume();
        }

        function removeEducation(i) {
            resumeData.education.splice(i, 1);
            renderEducation();
            updateResume();
        }

        function renderProjects() {
            const container = document.getElementById('projects-list');
            container.innerHTML = resumeData.projects.map((p, i) => `
                <div class="p-3 bg-slate-50 rounded border space-y-2 relative text-xs">
                    <button onclick="removeProject(${i})" class="absolute top-2 right-2 text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                    <input type="text" value="${p.title}" oninput="resumeData.projects[${i}].title=this.value; updateResume();" placeholder="Project Title" class="w-full p-1.5 border rounded">
                    <textarea rows="2" oninput="resumeData.projects[${i}].desc=this.value; updateResume();" placeholder="Description" class="w-full p-1.5 border rounded">${p.desc}</textarea>
                </div>
            `).join('');
        }

        function addProject() {
            resumeData.projects.push({ title: '', desc: '' });
            renderProjects();
            updateResume();
        }

        function removeProject(i) {
            resumeData.projects.splice(i, 1);
            renderProjects();
            updateResume();
        }

        function zoomResume(dir) {
            zoomLevel = Math.max(0.6, Math.min(1.4, zoomLevel + (dir * 0.1)));
            document.getElementById('resume-preview-container').style.transform = `scale(${zoomLevel})`;
        }

        function resetZoom() {
            zoomLevel = 1;
            document.getElementById('resume-preview-container').style.transform = `scale(1)`;
        }

        function triggerPrint() {
            window.print();
        }
    </script>
</body>
</html>
